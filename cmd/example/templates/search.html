<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Search — fragmentsgo example</title></head>
<body>
<nav><a href="/blog">← Blog</a></nav>
<h1>Search</h1>
<form method="get" action="/search">
  <input name="q" value="{{ .Query }}" placeholder="Search posts…">
  <button type="submit">Search</button>
</form>
{{ range .Results }}
<article>
  <h2><a href="{{ .Fragment.URL }}">{{ .Fragment.Title }}</a></h2>
  <p>{{ .Fragment.Preview }}</p>
</article>
{{ else }}{{ with .Query }}<p>No results for “{{ . }}”.</p>{{ end }}{{ end }}
</body>
</html>
