name: Scorecard

# OpenSSF Scorecard: grades the repository's security posture and publishes
# results to the Security tab. Free for public repositories.
on:
  push:
    branches: [main]
  schedule:
    - cron: "31 5 * * 6" # weekly

permissions: read-all

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_format: sarif
          results_file: results.sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
