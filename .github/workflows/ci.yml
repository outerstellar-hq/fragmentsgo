name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go build ./...

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Smoke test the example site
        run: |
          go build -o bin/example ./cmd/example
          PORT=8090 ./bin/example &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8090/blog >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://localhost:8090/blog -o /dev/null
          curl -sf http://localhost:8090/blog/archive -o /dev/null
          curl -sf http://localhost:8090/rss.xml -o /dev/null
          curl -sf http://localhost:8090/sitemap.xml -o /dev/null
