name: Release

# Library releases are tag-driven: push a v-tag (e.g. v0.1.0), get a fully
# tested GitHub Release with generated notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go build ./...
      - uses: softprops/action-gh-release@v2
        with:
          generate-release-notes: true
